server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/annasahay?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Defer datasource initialization to run after JPA entity scanning/DDL execution
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
